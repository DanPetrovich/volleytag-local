name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lightweight-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Compile Python sources
        run: python -m compileall -q range_server.py vision
      - name: Run temporal route regression tests
        run: python -m unittest discover -s vision/tests -p 'test_*.py' -v
      - name: Run evaluation schema checks
        run: node vision/tests/test_evaluation_schema.js
